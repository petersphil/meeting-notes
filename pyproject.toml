[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-meeting-notes"
version = "0.1.0"
description = "Fully offline meeting transcription, diarization, and local-LLM notes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Phil Peters"}]
dependencies = ["faster-whisper>=1.1.0", "numpy>=1.26", "soundfile>=0.12"]

[project.optional-dependencies]
diarization = ["pyannote.audio>=3.3"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
test = ["pytest>=8.0"]

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
